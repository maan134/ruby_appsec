name: Ruby

on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.2'
          
      - name: Setup Dependencies
        run: |
          gem install bundler
          bundle install
      - name: Vulnerability Checks
        continue-on-error: true
        run: |
          gem install bundler-audit
          bundle-audit update
          bundle-audit check --format json --output bundle-audit.json
      - name: Upload bundleAudit to DefectDojo
        run: |
          curl -X POST 'https://demo.defectdojo.org/api/v2/reimport-scan/' \
            -H 'accept: application/json' \
            -H 'Authorization: Token df8dd7d51d0861c60ff8544f13a9fcee37a58d44' \
            -F 'test=33' \
            -F 'active=true' \
            -F '[email protected];type=application/json' \
            -F file=@"bundle-audit.json" \
            -F 'scan_type=Bundler-Audit Scan' \
            -F 'tags=test'
          
      - name: Upload bundleAudit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-audit-report
          path: bundle-audit.json
          
      - name: SAST testing
        run: |
            gem install brakeman
            brakeman --no-exit-on-warn --no-exit-on-error -f json -o sast_fin.json    
      - name: Upload bundleAudit to DefectDojo
        run: |
          curl -X POST 'https://demo.defectdojo.org/api/v2/reimport-scan/' \
            -H 'accept: application/json' \
            -H 'Authorization: Token df8dd7d51d0861c60ff8544f13a9fcee37a58d44' \
            -F 'test=34' \
            -F 'active=true' \
            -F '[email protected];type=application/json' \
            -F file=@"sast_fin.json" \
            -F 'scan_type=Brakeman Scan' \
            -F 'tags=test'
          
      - name: Upload SAST-Finding Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAST-Finding-Report
          path: sast_fin.json

      - name: Generate SBOM
        run: |
          gem install cyclonedx-ruby
          cyclonedx-ruby -p . -o sbom.json
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

      - name: Secret Scanning
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog --version
          trufflehog git https://github.com/${{ github.repository }} --results=verified,unknown --json > trufflehog_results.json
      - name: Upload TruffleHog Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-report
          path: trufflehog_results.json

      - name: Secret Scanning
        continue-on-error: true
        uses: gitleaks/gitleaks-action@v2
        with:
          report-format: json
          report-path: gitleaks.json
      - name: Upload Gitleaks Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gitleak-report
          path: ./gitleaks.json

      - name: Secrets Scan - Gitleaks
        run: |
          docker pull ghcr.io/gitleaks/gitleaks:latest
          docker run -v $(pwd):/path ghcr.io/gitleaks/gitleaks:latest --report-format json --report-path gitleaks.json
            
      - name: Debug - List files
        run: ls -la
       
#      - name: Linting and Styling
#        run: |
#          gem install rubocop
#          rubocop -a

