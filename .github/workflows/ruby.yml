name: Ruby

on:
  workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0.2'
          
      - name: Setup Dependencies
        run: |
          gem install bundler
          bundle install
      - name: Vulnerability Checks
        continue-on-error: true
        run: |
          gem install bundler-audit
          bundle-audit update
          bundle-audit check --format json --output bundle-audit.json
      - name: Upload bundleAudit to DefectDojo
        run: |
          curl -X POST 'https://demo.defectdojo.org/api/v2/reimport-scan/' \
            -H 'accept: application/json' \
            -H 'Authorization: Token df8dd7d51d0861c60ff8544f13a9fcee37a58d44' \
            -F 'test=33' \
            -F 'active=true' \
            -F '[email protected];type=application/json' \
            -F file=@"bundle-audit.json" \
            -F 'scan_type=Bundler-Audit Scan' \
            -F 'tags=test'
          
      - name: Upload npmAudit Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-audit-report
          path: bundle-audit.json
          
      - name: SAST testing
        run: |
            gem install brakeman
            brakeman --no-exit-on-warn --no-exit-on-error          

#      - name: Linting and Styling
#        run: |
#          gem install rubocop
#          rubocop -a

      #bundle-audit
  #Dependency-Scan:
   # runs-on: ubuntu-latest
    #needs: build
    #permissions:
    #  security-events: write
    #steps:

      - name: Run Unit Tests
        run: |
          gem install rspec
          rspec
