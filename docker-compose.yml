#version: '3.0.2'
services:
  db:
    image: postgres
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./tmp/db:/var/lib/postgresql/
    networks:
      - zapnet
  web:
    build: .
    command: bash -c "rake db:create && rake db:migrate && rm -f tmp/pids/server.pid && bundle exec rails s -p 8880 -b '0.0.0.0'"
    volumes:
      - .:/myapp
    ports:
      - "8880:8880"
    depends_on:
      - db
    networks:
      - zapnet
  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    depends_on:
      - web
    networks:
      - zapnet
    volumes:
      - ./zap-config:/zap/wrk:ro
     # - ./reports:/zap/reports
    command: >
      sh -c "sleep 10 && zap-full-scan.py
      -t http://ruby_appsec-web-1:8880
      -r /tmp/zap-report.html
      -J /tmp/zap-report.json"

networks:
  zapnet:
    driver: bridge
